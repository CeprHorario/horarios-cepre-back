name: cepr-records-test
services:
  backend:
    image: node:24.22.0-trixie
    working_dir: /app
    user: node
    init: true
    command: npm run test:records
    environment:
      DATABASE_URL: postgresql://cepr:local-only@db:5432/cepr_records_test
      TEST_DATABASE_URL: postgresql://cepr:local-only@db:5432/cepr_records_test
      DB_POOL_MAX: '2'
      NODE_ENV: test
      GCS_BUCKET: cepr-records-test
      STORAGE_EMULATOR_HOST: http://gcs:4443
      GOOGLE_CLOUD_PROJECT: cepr-local
      CLASS_RECORDS_TASK_ENABLED: 'false'
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      gcs:
        condition: service_started
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cepr
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: cepr_records_test
    volumes:
      - records-postgres18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cepr -d cepr_records_test']
      interval: 2s
      retries: 30
  gcs:
    image: fsouza/fake-gcs-server:1.52.3
    command: ['-scheme', 'http', '-port', '4443', '-public-host', 'gcs:4443']
volumes:
  records-postgres18:
